name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: macos
            exe: ""
            extra: ""
            nim_url: https://nim-lang.org/download/nim-2.2.8-macosx_arm64.tar.xz
          - os: macos-14
            arch: x86_64
            target: macos
            exe: ""
            extra: "--cpu:amd64"
            nim_url: https://nim-lang.org/download/nim-2.2.8-macosx_arm64.tar.xz
          - os: ubuntu-latest
            arch: x86_64
            target: linux
            exe: ""
            extra: ""
            nim_url: https://nim-lang.org/download/nim-2.2.8-linux_x64.tar.xz
          - os: ubuntu-24.04-arm
            arch: arm64
            target: linux
            exe: ""
            extra: ""
            nim_url: https://nim-lang.org/download/nim-2.2.8-linux_arm64.tar.xz
          - os: windows-latest
            arch: x86_64
            target: windows
            exe: ".exe"
            extra: ""
            nim_url: https://nim-lang.org/download/nim-2.2.8_x64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        shell: bash
        run: |
          curl -fsSL "${{ matrix.nim_url }}" -o nim.pkg
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -Command "Expand-Archive -Path nim.pkg -DestinationPath ."
          else
            tar -xf nim.pkg
          fi
          echo "$(pwd)/nim-2.2.8/bin" >> "$GITHUB_PATH"

      - name: Unit tests (ignore matcher)
        shell: bash
        run: nim c -r --hints:off --path:. tests/test_ignore.nim

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          nim c -d:release --opt:speed ${{ matrix.extra }} \
            -o:dist/files-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.exe }} files.nim

      - name: Smoke test
        shell: bash
        run: |
          bin="dist/files-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.exe }}"
          "$bin" --version | grep -q "^files 0.1.0"
          "$bin" . -L 1 --no-icons --no-sizes > smoke.txt
          grep -q "files.nim" smoke.txt
          "$bin" . -L 1 --no-icons > smoke_sizes.txt
          grep -q "files.nim" smoke_sizes.txt
          grep -Eq "[0-9]+ dirs" smoke_sizes.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: files-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/files-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.exe }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

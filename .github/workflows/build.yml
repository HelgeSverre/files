name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: macos
            exe: ""
            extra: ""
            nim_url: https://nim-lang.org/download/nim-2.2.8-macosx_arm64.tar.xz
          - os: macos-14
            arch: x86_64
            target: macos
            exe: ""
            extra: "--cpu:amd64 --passC:'-arch x86_64' --passL:'-arch x86_64'"
            nim_url: https://nim-lang.org/download/nim-2.2.8-macosx_arm64.tar.xz
          - os: ubuntu-latest
            arch: x86_64
            target: linux
            exe: ""
            extra: ""
            nim_url: https://nim-lang.org/download/nim-2.2.8-linux_x64.tar.xz
          - os: ubuntu-24.04-arm
            arch: arm64
            target: linux
            exe: ""
            extra: ""
            nim_url: https://nim-lang.org/download/nim-2.2.8-linux_arm64.tar.xz
          - os: windows-latest
            arch: x86_64
            target: windows
            exe: ".exe"
            extra: ""
            nim_url: https://nim-lang.org/download/nim-2.2.8_x64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            curl -fsSL "${{ matrix.nim_url }}" -o nim.zip
            powershell -Command "Expand-Archive -Path nim.zip -DestinationPath ."
          else
            curl -fsSL "${{ matrix.nim_url }}" -o nim.tar.xz
            tar -xf nim.tar.xz
          fi
          echo "$(pwd)/nim-2.2.8/bin" >> "$GITHUB_PATH"

      - name: Unit tests (ignore matcher)
        shell: bash
        run: nim c -r --hints:off --path:. tests/test_ignore.nim

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          nim c -d:release --opt:speed ${{ matrix.extra }} \
            -o:dist/files-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.exe }} files.nim

      - name: Smoke test
        shell: bash
        run: |
          bin="dist/files-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.exe }}"
          "$bin" --version | grep -qE "^files [0-9]+\.[0-9]+"
          "$bin" . -L 1 --no-icons --no-sizes > smoke.txt
          grep -q "files.nim" smoke.txt
          "$bin" . -L 1 --no-icons > smoke_sizes.txt
          grep -q "files.nim" smoke_sizes.txt
          grep -Eq "[0-9]+ dirs" smoke_sizes.txt

      - name: Archive (Homebrew / installers)
        shell: bash
        run: |
          mkdir -p archive
          cp dist/files-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.exe }} archive/files
          tar -czf files-${{ matrix.target }}-${{ matrix.arch }}.tar.gz -C archive files
          shasum -a 256 files-${{ matrix.target }}-${{ matrix.arch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: files-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/files-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.exe }}
          if-no-files-found: error

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: files-${{ matrix.target }}-${{ matrix.arch }}-archive
          path: files-${{ matrix.target }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha_macos_arm64="$(shasum -a 256 dist/files-macos-arm64.tar.gz   | awk '{print $1}')"
          sha_macos_x64="$(shasum -a 256 dist/files-macos-x86_64.tar.gz  | awk '{print $1}')"
          sha_linux_x64="$(shasum -a 256 dist/files-linux-x86_64.tar.gz  | awk '{print $1}')"
          sha_linux_arm64="$(shasum -a 256 dist/files-linux-arm64.tar.gz | awk '{print $1}')"
          tmp="$(mktemp -d)"
          git clone --quiet --depth 1 \
            "https://x-access-token:${HOMEBREW_TOKEN}@github.com/HelgeSverre/homebrew-tap.git" \
            "$tmp/tap"
          bash scripts/render-formula.sh "$version" "$sha_macos_arm64" "$sha_macos_x64" \
            "$sha_linux_x64" "$sha_linux_arm64" > "$tmp/tap/Formula/files.rb"
          cd "$tmp/tap"
          if git diff --quiet; then
            echo "Formula already up to date for v${version}"
            exit 0
          fi
          git add Formula/files.rb
          git -c user.name="files-release-bot" \
              -c user.email="files-release-bot@users.noreply.github.com" \
              commit -m "Update files formula to ${GITHUB_REF_NAME}"
          git push --quiet origin main
